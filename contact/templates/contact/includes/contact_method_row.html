<div class="contact-method-row{% if selected_contact.state == 'active' %} contact-method-row--editable{% endif %}">
    <div class="contact-method-copy">
        {% if method.type == "email" %}<a class="contact-method-value contact-method-value--email link-body-emphasis" href="mailto:{{ method.value }}" title="{{ method.value }}" aria-label="Email {{ method.value }}">{{ method.value }}</a>{% else %}<a class="contact-method-value contact-method-value--telephone link-body-emphasis" href="tel:{{ method.value }}" title="{{ method.value }}" aria-label="Telephone {{ method.value }}">{{ method.value }}</a>{% endif %}
    </div>
    {% if selected_contact.state == "active" %}
        <div class="contact-method-actions" aria-label="Contact detail actions">
            <a class="contact-method-action" href="{% if navigation_query %}?{{ navigation_query }}&amp;{% else %}?{% endif %}selected={{ selected_contact.pk }}&amp;edit_method={{ method.pk }}" aria-label="Edit {{ method.get_type_display|lower }} {{ method.value }}">
                <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
                    <path d="M12.9 1.7a1.5 1.5 0 0 1 2.1 2.1l-9.5 9.5-3.1.8.8-3.1 9.7-9.3Zm-8.8 9.9-.3 1.1 1.1-.3 8.2-8.2-.8-.8-8.2 8.2Z" />
                </svg>
            </a>
            <button class="contact-method-action contact-method-action--delete" type="button" data-bs-toggle="modal" data-bs-target="#deleteContactMethodModal{{ method.pk }}" aria-label="Delete {{ method.get_type_display|lower }} {{ method.value }}">
                <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
                    <path d="M3.3 2.3 8 7l4.7-4.7 1 1L9 8l4.7 4.7-1 1L8 9l-4.7 4.7-1-1L7 8 2.3 3.3l1-1Z" />
                </svg>
            </button>
        </div>
    {% endif %}
</div>
