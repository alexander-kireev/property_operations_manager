<section class="notes-board-shell" aria-label="Notes">
    <div class="notes-board-shell__list">
        <div class="notes-board-shell__empty text-center text-body-secondary">
            <p class="mb-0">No notes yet. Add one below.</p>
        </div>
    </div>

    <div class="notes-board-shell__composer" aria-label="New note controls">
        <textarea
            class="form-control"
            rows="1"
            placeholder="New note..."
            aria-label="New note"
            disabled
        ></textarea>
        <button class="btn theme-action" type="button" disabled>Add</button>
    </div>
</section>
