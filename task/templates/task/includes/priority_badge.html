{% if task.priority == 4 %}
    <span class="badge bg-danger-subtle border border-danger-subtle text-danger-emphasis">{{ task.get_priority_display }}</span>
{% elif task.priority == 3 %}
    <span class="badge bg-warning-subtle border border-warning-subtle text-warning-emphasis">{{ task.get_priority_display }}</span>
{% elif task.priority == 2 %}
    <span class="badge bg-primary-subtle border border-primary-subtle text-primary-emphasis">{{ task.get_priority_display }}</span>
{% else %}
    <span class="badge bg-secondary-subtle border border-secondary-subtle text-secondary-emphasis">{{ task.get_priority_display }}</span>
{% endif %}
