<nav class="my-work-section-nav card border-0 shadow-sm mb-4" aria-label="My Work sections">
    <div class="nav px-3">
        <a
            class="nav-link px-4 py-3 d-flex align-items-center gap-2{% if active_section == 'tasks' %} active{% endif %}"
            href="{% url 'task:tasks' %}"
            {% if active_section == "tasks" %}aria-current="page"{% endif %}
        >
            Tasks
            {% if task_count is not None %}<span class="badge rounded-pill text-bg-secondary">{{ task_count }}</span>{% endif %}
        </a>
        <a
            class="nav-link px-4 py-3 d-flex align-items-center gap-2{% if active_section == 'issues' %} active{% endif %}"
            href="{% url 'issue:issues' %}"
            {% if active_section == "issues" %}aria-current="page"{% endif %}
        >
            Issues
            {% if issue_count is not None %}<span class="badge rounded-pill {% if active_section == 'issues' %}text-bg-dark{% else %}text-bg-secondary{% endif %}">{{ issue_count }}</span>{% endif %}
        </a>
        <span class="nav-link disabled px-4 py-3" aria-disabled="true">Events</span>
    </div>
</nav>
